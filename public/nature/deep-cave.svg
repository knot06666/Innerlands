<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060e14"/>
      <stop offset="50%" stop-color="#0e2030"/>
      <stop offset="100%" stop-color="#081828"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#1a4060" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#060e14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Ambient cave glow -->
  <rect width="1400" height="900" fill="url(#glow)"/>

  <!-- Stalactites — top, pointing down -->
  <polygon points="80,0 60,220 100,0" fill="#0e2838" opacity="0.90"/>
  <polygon points="200,0 175,300 225,0" fill="#0a2030" opacity="0.88"/>
  <polygon points="360,0 335,180 385,0" fill="#102840" opacity="0.85"/>
  <polygon points="500,0 478,260 522,0" fill="#0e2438" opacity="0.90"/>
  <polygon points="650,0 626,320 674,0" fill="#0a2030" opacity="0.88"/>
  <polygon points="780,0 758,200 802,0" fill="#102840" opacity="0.85"/>
  <polygon points="920,0 896,280 944,0" fill="#0e2438" opacity="0.90"/>
  <polygon points="1060,0 1038,240 1082,0" fill="#0a2030" opacity="0.88"/>
  <polygon points="1180,0 1158,190 1202,0" fill="#102840" opacity="0.85"/>
  <polygon points="1310,0 1288,310 1332,0" fill="#0e2438" opacity="0.90"/>

  <!-- Stalactites — second layer, shorter -->
  <polygon points="140,0 124,130 156,0" fill="#0c2234" opacity="0.75"/>
  <polygon points="440,0 424,160 456,0" fill="#0c2234" opacity="0.70"/>
  <polygon points="840,0 822,140 858,0" fill="#0c2234" opacity="0.75"/>
  <polygon points="1120,0 1104,120 1136,0" fill="#0c2234" opacity="0.72"/>

  <!-- Stalagmites — bottom, pointing up -->
  <polygon points="120,900 100,640 140,900" fill="#0c2234" opacity="0.88"/>
  <polygon points="280,900 260,700 300,900" fill="#0e2838" opacity="0.85"/>
  <polygon points="450,900 428,660 472,900" fill="#0a2030" opacity="0.90"/>
  <polygon points="620,900 600,720 640,900" fill="#0c2234" opacity="0.86"/>
  <polygon points="780,900 760,680 800,900" fill="#0e2838" opacity="0.88"/>
  <polygon points="960,900 940,640 980,900" fill="#0a2030" opacity="0.85"/>
  <polygon points="1120,900 1100,700 1140,900" fill="#0c2234" opacity="0.90"/>
  <polygon points="1280,900 1260,660 1300,900" fill="#0e2838" opacity="0.86"/>

  <!-- Stalactite drip channels (horizontal depth lines) -->
  <ellipse cx="700" cy="380" rx="1300" ry="28" fill="#0e2030" opacity="0.30"/>
  <ellipse cx="700" cy="440" rx="1100" ry="22" fill="#0a1c28" opacity="0.25"/>
  <ellipse cx="700" cy="320" rx="900" ry="18" fill="#102234" opacity="0.22"/>
  <ellipse cx="700" cy="500" rx="1400" ry="24" fill="#0c1e2c" opacity="0.20"/>

  <!-- Crystal sparkle dots -->
  <circle cx="340" cy="420" r="3" fill="#4a9abf" opacity="0.60"/>
  <circle cx="700" cy="360" r="4" fill="#5ab0d0" opacity="0.55"/>
  <circle cx="1060" cy="440" r="3" fill="#4a9abf" opacity="0.58"/>
  <circle cx="520" cy="500" r="2.5" fill="#60b8d8" opacity="0.50"/>
