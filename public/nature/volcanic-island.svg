<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="60%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#5a2808"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Smoke/ash atmospheric bands -->
  <ellipse cx="700" cy="180" rx="1200" ry="55" fill="#3a2818" opacity="0.45"/>
  <ellipse cx="500" cy="240" rx="900" ry="44" fill="#2e1e10" opacity="0.38"/>
  <ellipse cx="900" cy="140" rx="700" ry="38" fill="#442a14" opacity="0.32"/>
  <ellipse cx="700" cy="300" rx="1400" ry="48" fill="#38221a" opacity="0.28"/>
  <ellipse cx="300" cy="350" rx="600" ry="35" fill="#3a2010" opacity="0.25"/>

  <!-- Volcanic island base / ocean -->
  <ellipse cx="700" cy="940" rx="1600" ry="440" fill="#1a0c04" opacity="0.95"/>

  <!-- Lava flow streams -->
  <ellipse cx="700" cy="700" rx="1200" ry="38" fill="#c84010" opacity="0.30"/>
  <ellipse cx="700" cy="740" rx="1000" ry="32" fill="#d84a14" opacity="0.26"/>
  <ellipse cx="700" cy="660" rx="900" ry="28" fill="#b83808" opacity="0.24"/>
  <ellipse cx="700" cy="780" rx="1400" ry="36" fill="#c03808" opacity="0.22"/>
  <ellipse cx="700" cy="620" rx="700" ry="22" fill="#e05018" opacity="0.20"/>

  <!-- Volcanic cone — main -->
  <polygon points="700,120 440,720 960,720" fill="#2a1008" opacity="0.92"/>
  <!-- Cone highlight ridge -->
  <polygon points="700,120 660,380 740,380" fill="#3a1810" opacity="0.60"/>

  <!-- Secondary volcano — left -->
  <polygon points="220,340 80,700 360,700" fill="#200c04" opacity="0.80"/>

  <!-- Secondary volcano — right -->
  <polygon points="1180,400 1060,700 1300,700" fill="#200c04" opacity="0.75"/>

  <!-- Lava glow at cone base -->
  <ellipse cx="700" cy="710" rx="220" ry="28" fill="#e85a10" opacity="0.45"/>
  <ellipse cx="700" cy="730" rx="180" ry="22" fill="#f06820" opacity="0.38"/>
  <ellipse cx="220" cy="694" rx="140" ry="20" fill="#d04810" opacity="0.35"/>
  <ellipse cx="1180" cy="694" rx="120" ry="18" fill="#d04810" opacity="0.32"/>

  <!-- Ember sparks -->
  <circle cx="640" cy="200" r="3" fill="#f07830" opacity="0.55"/>
  <circle cx="760" cy="260" r="2" fill="#e86820" opacity="0.50"/>
  <circle cx="580" cy="320" r="3" fill="#f07030" opacity="0.48"/>
  <circle cx="820" cy="180" r="2" fill="#e86020" opacity="0.52"/>
  <circle cx="700" cy="380" r="2.5" fill="#f07828" opacity="0.45"/>
</svg>
