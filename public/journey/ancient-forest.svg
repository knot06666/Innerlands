<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060e08"/>
      <stop offset="50%" stop-color="#0c2010"/>
      <stop offset="100%" stop-color="#102818"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <!-- Canopy light -->
  <ellipse cx="700" cy="0" rx="600" ry="200" fill="#204828" opacity="0.35"/>
  <ellipse cx="700" cy="80" rx="400" ry="120" fill="#288038" opacity="0.18"/>
  <!-- Mist bands between trunks -->
  <ellipse cx="700" cy="440" rx="1300" ry="55" fill="#184020" opacity="0.30"/>
  <ellipse cx="400" cy="560" rx="900"  ry="42" fill="#1c4828" opacity="0.25"/>
  <ellipse cx="1000" cy="380" rx="800" ry="38" fill="#183c20" opacity="0.22"/>
  <!-- Tree trunks — back layer -->
  <rect x="50"  y="0" width="30" height="900" fill="#0a1c0c" opacity="0.80"/>
  <rect x="180" y="0" width="24" height="900" fill="#0e2010" opacity="0.78"/>
  <rect x="330" y="0" width="28" height="900" fill="#0a1c0c" opacity="0.80"/>
  <rect x="490" y="0" width="26" height="900" fill="#0e2010" opacity="0.78"/>
  <rect x="640" y="0" width="30" height="900" fill="#0a1c0c" opacity="0.80"/>
  <rect x="790" y="0" width="24" height="900" fill="#0e2010" opacity="0.78"/>
  <rect x="940" y="0" width="28" height="900" fill="#0a1c0c" opacity="0.80"/>
  <rect x="1100" y="0" width="26" height="900" fill="#0e2010" opacity="0.78"/>
  <rect x="1260" y="0" width="30" height="900" fill="#0a1c0c" opacity="0.80"/>
  <!-- Tree trunks — front layer (larger) -->
  <rect x="0"    y="0" width="38" height="900" fill="#060e08" opacity="0.92"/>
  <rect x="260"  y="0" width="34" height="900" fill="#081208" opacity="0.90"/>
  <rect x="560"  y="0" width="36" height="900" fill="#060e08" opacity="0.92"/>
  <rect x="810"  y="0" width="34" height="900" fill="#081208" opacity="0.90"/>
  <rect x="1070" y="0" width="36" height="900" fill="#060e08" opacity="0.92"/>
  <rect x="1362" y="0" width="38" height="900" fill="#081208" opacity="0.92"/>
  <!-- Root forms at base -->
  <ellipse cx="150"  cy="900" rx="80"  ry="30" fill="#060c08" opacity="0.80"/>
  <ellipse cx="410"  cy="900" rx="90"  ry="32" fill="#060c08" opacity="0.80"/>
  <ellipse cx="690"  cy="900" rx="85"  ry="30" fill="#060c08" opacity="0.80"/>
  <ellipse cx="940"  cy="900" rx="88"  ry="31" fill="#060c08" opacity="0.80"/>
  <ellipse cx="1200" cy="900" rx="80"  ry="30" fill="#060c08" opacity="0.80"/>
  <!-- Bioluminescent moss dots -->
  <circle cx="320"  cy="620" r="3" fill="#60d080" opacity="0.35"/>
  <circle cx="680"  cy="580" r="4" fill="#50c870" opacity="0.30"/>
  <circle cx="1020" cy="640" r="3" fill="#60d080" opacity="0.32"/>
  <circle cx="150"  cy="700" r="2.5" fill="#50c870" opacity="0.28"/>
  <circle cx="870"  cy="700" r="3" fill="#60d080" opacity="0.30"/>
</svg>
