<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2c38"/>
      <stop offset="55%" stop-color="#304858"/>
      <stop offset="100%" stop-color="#4a6878"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <!-- Sky wisps -->
  <ellipse cx="700" cy="180" rx="900" ry="35" fill="#7898b0" opacity="0.18"/>
  <ellipse cx="300" cy="250" rx="600" ry="28" fill="#7090a8" opacity="0.14"/>
  <ellipse cx="1100" cy="220" rx="500" ry="25" fill="#7898b0" opacity="0.12"/>
  <!-- Distant shoreline hills -->
  <ellipse cx="200"  cy="540" rx="350" ry="120" fill="#253850" opacity="0.70"/>
  <ellipse cx="700"  cy="520" rx="500" ry="100" fill="#2c4460" opacity="0.68"/>
  <ellipse cx="1200" cy="535" rx="380" ry="115" fill="#253850" opacity="0.70"/>
  <!-- Lake surface — large reflective ellipse -->
  <ellipse cx="700" cy="800" rx="1200" ry="420" fill="#1a3048" opacity="0.90"/>
  <ellipse cx="700" cy="760" rx="1000" ry="340" fill="#203848" opacity="0.80"/>
  <ellipse cx="700" cy="720" rx="800"  ry="240" fill="#284860" opacity="0.70"/>
  <!-- Lake reflection shimmer -->
  <ellipse cx="700" cy="640" rx="400" ry="20"  fill="#8abed0" opacity="0.18"/>
  <ellipse cx="500" cy="660" rx="250" ry="13"  fill="#80b0c8" opacity="0.14"/>
  <ellipse cx="900" cy="655" rx="220" ry="12"  fill="#80b0c8" opacity="0.14"/>
  <ellipse cx="700" cy="680" rx="550" ry="16"  fill="#7aacca" opacity="0.12"/>
  <ellipse cx="340" cy="700" rx="200" ry="10"  fill="#78a8c8" opacity="0.12"/>
  <ellipse cx="1060" cy="695" rx="180" ry="9"  fill="#78a8c8" opacity="0.12"/>
  <!-- Foreground shore -->
  <ellipse cx="700" cy="940" rx="1600" ry="260" fill="#14202e" opacity="0.90"/>
  <!-- Still water edge ripple -->
  <ellipse cx="700" cy="620" rx="700" ry="8"   fill="#a0c8e0" opacity="0.10"/>
</svg>
